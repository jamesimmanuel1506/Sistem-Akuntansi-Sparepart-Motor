name: Deploy frontend to GitHub Pages

on:
  push:
    paths:
      - frontend/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set SUPABASE_URL and SUPABASE_ANON_KEY as repository variables."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "SUPABASE_URL must use HTTPS."
              exit 1
              ;;
          esac
          mkdir -p _site
          cp frontend/index.html frontend/app.js frontend/styles.css _site/
          SUPABASE_URL="${SUPABASE_URL%/}" node -e "require('fs').writeFileSync('_site/config.js', 'window.RODAKAS_SUPABASE_URL = ' + JSON.stringify(process.env.SUPABASE_URL) + ';\nwindow.RODAKAS_SUPABASE_ANON_KEY = ' + JSON.stringify(process.env.SUPABASE_ANON_KEY) + ';\n')"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
